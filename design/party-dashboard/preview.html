const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod=n=>Math.floor((n-10)/2),pb=p=>2+Math.floor((p.level-1)/4),signed=n=>`${n<0?'−':'+'}${Math.abs(n)}`;
const save=(p,k)=>mod(p.abilities[k])+(p.saves.includes(k)?pb(p):0)+(p.saveBonus||0);
const skill=(p,k)=>mod(p.abilities[skills[k][1]])+(p.skills[k]?p.skills[k]*pb(p):p.halfSkills?Math.floor(pb(p)/2):0);
const name=p=>state.longNames&&p.id==='sera'?'Seraphina of the Silverwood, Keeper of the Last Watch and the Western Gate':p.name;
const party=()=>state.empty?[]:people;
const matches=()=>party().filter(p=>`${name(p)} ${p.klass} ${p.player}`.toLowerCase().includes(state.query.trim().toLowerCase()));
const selected=()=>people.find(p=>p.id===state.selected)||people[0];
const button=(text,action,id='',classes='btn',extra='')=>`<button type="button" class="${classes}" data-action="${action}"${id?` data-id="${id}"`:''} ${extra}>${text}</button>`;
function identity(p,click=false){const content=`<span class="identity"><span class="initial" aria-hidden="true">${p.name[0]}</span><span><strong>${esc(name(p))}</strong><small>Level ${p.level} ${p.klass} · ${p.player}</small></span></span>`;return click?button(content,'select',p.id,'row-name',`aria-label="View ${esc(name(p))}'s training"`):content}
function saveStrip(p){return `<dl class="save-strip" aria-label="${esc(name(p))}'s saving throws">${abilities.map(([key,label])=>`<div class="${p.saves.includes(key)?'trained':''}"><dt><abbr title="${label}" style="text-decoration:none">${label.slice(0,3)}</abbr></dt><dd><span class="sr-only">${p.saves.includes(key)?'Proficient, ':''}</span>${p.saves.includes(key)?'<span class="dot" aria-hidden="true"></span>':''}${signed(save(p,key))}</dd></div>`).join('')}</dl>`}
const legend=()=>'<div class="legend"><span><span class="dot" aria-hidden="true"></span>Proficient</span><span><span class="expert-symbol" aria-hidden="true">◆◆</span>Expertise</span></div>';
function trained(p,limit=99){return Object.entries(p.skills).sort((a,b)=>b[1]-a[1]||skills[a[0]][0].localeCompare(skills[b[0]][0])).slice(0,limit).map(([k,rank])=>`<span>${rank===2?'<span class="expert-symbol" aria-hidden="true">◆◆</span>':''}${skills[k][0]} ${signed(skill(p,k))}</span>`).join('')}
function skillsList(p,all=false){const keys=Object.keys(skills).filter(k=>all||p.skills[k]).sort((a,b)=>skills[a][0].localeCompare(skills[b][0]));return `<dl class="skill-list">${keys.map(k=>`<div><dt>${skills[k][0]}<small>${p.skills[k]===2?'Expertise':p.skills[k]?'Proficient':p.halfSkills?'Jack of All Trades':'Untrained'}</small></dt><dd>${signed(skill(p,k))}</dd></div>`).join('')}</dl>`}
function training(p){return `<dl class="training-list">${Object.entries(p.training).map(([kind,items])=>`<div><dt>${kind}</dt><dd>${items.length?items.map(esc).join(', '):'None recorded'}</dd></div>`).join('')}</dl>`}
function combat(p){return `<details class="combat"><summary>Combat reference <span class="small">· attacks & features</span></summary><div class="combat-lines">${[...p.attacks,...p.features].map(([n,d])=>`<div><strong>${esc(n)}</strong><small>${esc(d)}</small></div>`).join('')}</div>${button('Combat on full sheet','sheet',p.id,'btn quiet','data-section="combat"')}</details>`}
function reference(p,opts={}){return `<div class="reference-head">${identity(p)}${button('Open sheet','sheet',p.id,'btn','data-section="proficiencies" aria-label="Open '+esc(name(p))+'’s sheet"')}</div>${saveStrip(p)}<p class="save-note">Proficiency bonus ${signed(pb(p))}.${p.saveBonus?' Includes +1 to all saves from Ring of Protection.':''}</p><div class="reference-grid"><section aria-label="${esc(name(p))}'s skills"><div class="section-title"><h3>Skill proficiencies</h3>${opts.all?button(state.skillsAll?'Trained only':'All 18 skills','all-skills',p.id,'link',`aria-pressed="${state.skillsAll}"`):''}</div>${skillsList(p,opts.all&&state.skillsAll)}</section><section aria-label="${esc(name(p))}'s training"><div class="section-title"><h3>Training & languages</h3></div>${training(p)}</section></div>${combat(p)}`}
function search(){return `<div class="toolbar"><label class="search-label">Find in party<input type="search" id="party-search" placeholder="Character, class or player…" value="${esc(state.query)}"></label>${legend()}</div>`}
function roster(mode='focus'){return `<aside class="roster" aria-label="Choose character">${mode==='sheet'?button(state.collapsed?'Show':'Hide character list','collapse','','btn quiet roster-toggle',`aria-expanded="${!state.collapsed}" aria-label="${state.collapsed?'Expand':'Collapse'} character list"`):'<h3>Characters</h3>'}${(mode==='sheet'?party():matches()).map(p=>button(`<span class="initial" aria-hidden="true">${p.name[0]}</span><span class="roster-name"><strong>${esc(p.short)}</strong><small>${p.klass} ${p.level}</small></span>`,mode==='sheet'?'sheet-character':'select',p.id,'',`aria-pressed="${p.id===state.selected}" aria-label="${esc(name(p))}, ${p.klass}"`)).join('')}</aside>`}
function empty(){return `<section class="empty"><h2>${state.empty?'Choose who is at the table':'No matching characters'}</h2><p>${state.empty?'Your party selection starts here. NPCs and companions stay out of this view until you include them.':'Try a character name, class or player, or clear the search to see the whole party.'}</p>${button(state.empty?'Restore example party':'Clear search',state.empty?'restore':'clear','','btn primary')}</section>`}
function ledger(){return `<table class="overview-table"><caption>Saving throw modifiers · proficiency marked with a filled dot</caption><colgroup><col class="name-col">${abilities.map(()=>'<col>').join('')}<col class="skill-col"><col class="action-col"></colgroup><thead><tr><th scope="col">Character</th>${abilities.map(([,label])=>`<th scope="col"><abbr title="${label}" style="text-decoration:none">${label.slice(0,3)}</abbr></th>`).join('')}<th scope="col">Trained skills</th><th scope="col"><span class="sr-only">Training</span></th></tr></thead><tbody>${matches().map(p=>`<tr><td>${identity(p,true)}<div class="ledger-mobile-saves">${saveStrip(p)}</div></td>${abilities.map(([k,label])=>`<td class="save-cell ${p.saves.includes(k)?'trained':''}"><span class="sr-only">${label}, ${p.saves.includes(k)?'proficient, ':''}</span>${p.saves.includes(k)?'<span class="dot" aria-hidden="true"></span>':''}${signed(save(p,k))}</td>`).join('')}<td class="skill-preview">${trained(p,3)}${Object.keys(p.skills).length>3?`<span class="muted">+${Object.keys(p.skills).length-3} more</span>`:''}</td><td class="actions-cell">${button(state.expanded===p.id?'Close':'Training','expand',p.id,'btn quiet',`aria-expanded="${state.expanded===p.id}" aria-controls="detail-${p.id}" aria-label="${state.expanded===p.id?'Close':'Open'} ${esc(name(p))}'s training"`)}</td></tr>${state.expanded===p.id?`<tr class="ledger-detail"><td colspan="9"><section id="detail-${p.id}" aria-label="${esc(name(p))}'s training reference">${reference(p)}</section></td></tr>`:''}`).join('')}</tbody></table>`}
function focusView(){return `<div class="list-layout">${roster()}<label class="mobile-character-picker">Character<select id="mobile-character">${matches().map(p=>`<option value="${p.id}" ${p.id===state.selected?'selected':''}>${esc(name(p))} · ${p.klass}</option>`).join('')}</select></label><section class="focus-workspace" aria-label="Selected character">${reference(selected(),{all:true})}</section></div>`}
function checkValue(p){const [kind,key]=state.check.split(':');return kind==='save'?save(p,key):skill(p,key)}
function finder(){const [kind,key]=state.check.split(':'),label=kind==='save'?abilities.find(a=>a[0]===key)[1]+' saving throw':skills[key][0],ranked=[...matches()].sort((a,b)=>checkValue(b)-checkValue(a)||a.name.localeCompare(b.name));return `<div class="finder-bar"><label>What does the scene need?<select id="check-select"><optgroup label="Saving throws">${abilities.map(([k,n])=>`<option value="save:${k}" ${state.check==='save:'+k?'selected':''}>${n} saving throw</option>`).join('')}</optgroup><optgroup label="Skills">${Object.entries(skills).map(([k,[n]])=>`<option value="skill:${k}" ${state.check==='skill:'+k?'selected':''}>${n}</option>`).join('')}</optgroup></select></label><p class="secondary">Highest modifier first.<br>Conditional effects still need review.</p></div><h2 class="sr-only">${label} comparison</h2><div class="ranked" aria-label="${label} party comparison">${ranked.map(p=>{const rank=kind==='save'?(p.saves.includes(key)?1:0):p.skills[key]||0;return button(`${identity(p)}<span class="rank-bonus num">${signed(checkValue(p))}</span><span class="rank-training">${rank===2?'Expertise':rank?'Proficient':kind==='skill'&&p.halfSkills?'Jack of All Trades':'Untrained'}</span><span aria-hidden="true">›</span>`,'select',p.id,'rank-row',`aria-pressed="${p.id===state.selected}" aria-label="${esc(name(p))}, ${signed(checkValue(p))}, ${rank===2?'expertise':rank?'proficient':'untrained'}"`)}).join('')}</div><section aria-label="Selected character">${reference(selected())}</section>`}
function foldout(){return `<div class="foldout-list">${matches().map(p=>`<article class="fold-row"><button type="button" class="fold-top" data-action="expand" data-id="${p.id}" aria-expanded="${state.expanded===p.id}" aria-controls="detail-${p.id}" aria-label="${state.expanded===p.id?'Close':'Open'} ${esc(name(p))}'s training">${identity(p)}${saveStrip(p)}<span class="chevron" aria-hidden="true">${state.expanded===p.id?'−':'+'}</span></button><p class="fold-skills">${Object.entries(p.skills).sort((a,b)=>b[1]-a[1]).map(([k,r])=>`${skills[k][0]}${r===2?' (expertise)':''}`).join(' · ')}</p>${state.expanded===p.id?`<section id="detail-${p.id}" class="fold-details" aria-label="${esc(name(p))}'s expanded training"><div class="reference-head"><span class="secondary">Proficiency bonus ${signed(pb(p))}</span>${button('Open sheet','sheet',p.id,'btn','data-section="proficiencies"')}</div><div class="reference-grid"><section><div class="section-title"><h3>Skill proficiencies</h3></div>${skillsList(p)}</section><section><div class="section-title"><h3>Training & languages</h3></div>${training(p)}</section></div>${p.saveBonus?'<p class="save-note" style="margin-top:16px">Saves include +1 from Ring of Protection.</p>':''}${combat(p)}</section>`:''}</article>`).join('')}</div>`}
function sheet(){const p=selected();return `<div class="sheet-bar">${button('‹ Back to party','back','','btn primary')}<span class="secondary">Example sheet · navigation preview</span></div><div class="sheet-layout ${state.collapsed?'collapsed':''}">${roster('sheet')}<section class="sheet-content"><h1>${esc(name(p))}</h1><p class="muted">Level ${p.level} ${p.klass} · ${p.player}</p><div class="sheet-summary"><strong>HP ${p.hp.join(' / ')}</strong><strong>AC ${p.ac}</strong><span>Proficiency ${signed(pb(p))}</span></div><nav class="sheet-tabs" aria-label="Example sheet sections">${[['proficiencies','Proficiencies'],['combat','Combat'],['features','Features']].map(([k,n])=>button(n,'sheet-section',p.id,'btn quiet',`data-section="${k}" aria-pressed="${state.section===k}"`)).join('')}</nav>${state.section==='proficiencies'?`${saveStrip(p)}<div class="reference-grid"><section><h2>All skills</h2>${skillsList(p,true)}</section><section><h2>Training & languages</h2>${training(p)}</section></div>`:state.section==='combat'?`<h2>Attacks</h2><div class="combat-lines">${p.attacks.map(([n,d])=>`<div><strong>${n}</strong><small>${d}</small></div>`).join('')}</div>${saveStrip(p)}`:`<h2>Features</h2><div class="combat-lines">${p.features.map(([n,d])=>`<div><strong>${n}</strong><small>${d}</small></div>`).join('')}</div>`}</section></div>`}
let returnFocus='',returnSection='',returnScroll=0;const openCombat=new Set();
function render(options={}){const current=concepts.find(c=>c.key===state.layout),list=matches();if(list.length&&!list.some(p=>p.id===state.selected)&&!state.sheet)state.selected=list[0].id;
 $('#directions').innerHTML=concepts.map((c,i)=>button(`${i+1}. <strong>${c.name}</strong><span>${c.hint}</span>`,'layout',c.key,'',`aria-pressed="${state.layout===c.key}"`)).join('');
 $('#concept-note').textContent=current.intro;$('#review-note').textContent=current.review;
 $('#app').innerHTML=`<header class="appbar"><span class="brand">Codex of Heroes</span><span class="campaign">Revalon campaign · DM view</span></header>${state.sheet?sheet():`<header class="page-heading"><div><h1 tabindex="-1">Party <span class="count">${party().length} characters</span></h1><p>${state.layout==='finder'?'Find the right modifier.':'Saving throws & proficiencies'}</p></div><span class="tag">${current.name}</span></header>${search()}${!list.length?empty():({ledger,focus:focusView,finder,foldout}[state.layout])()}`}`;
 document.querySelectorAll('.combat').forEach(d=>{const section=d.closest('section[aria-label]');const key=state.layout+':'+state.selected+':'+(section?.getAttribute('aria-label')||'');d.dataset.key=key;d.open=openCombat.has(key)});
 if(options.focusHeading)$('#app h1')?.focus({preventScroll:true});
}
function announce(message){$('#announcement').textContent=message}
document.addEventListener('toggle',e=>{if(e.target.matches?.('.combat')){const k=e.target.dataset.key;if(e.target.open)openCombat.add(k);else openCombat.delete(k)}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;const focusKey=a+':'+(id||'');
 if(a==='layout'){expansion[state.layout]=state.expanded;state.layout=id;state.expanded=expansion[id]||'';state.sheet=false;try{history.replaceState(null,'','#'+id)}catch{/* Embedded previews may restrict history. */}render({focusHeading:true});announce(concepts.find(c=>c.key===id).name+' preview');return}
 if(a==='select'){state.selected=id;if(state.layout==='ledger')state.expanded=state.expanded===id?'':id;render();restoreButton(a,id);return}
 if(a==='expand'){state.selected=id;state.expanded=state.expanded===id?'':id;render();restoreButton(a,id);return}
 if(a==='all-skills'){state.skillsAll=!state.skillsAll;render();restoreButton(a,id);return}
 if(a==='sheet'){returnFocus=focusKey;returnSection=b.dataset.section||'';returnScroll=window.scrollY;state.selected=id;state.sheet=true;state.section=b.dataset.section||'proficiencies';render();$('#app .sheet-content h1').tabIndex=-1;$('#app .sheet-content h1').focus();$('#app').scrollIntoView({block:'start'});return}
 if(a==='back'){state.sheet=false;render();window.scrollTo(0,returnScroll);const [action,key]=returnFocus.split(':');const target=document.querySelector(`#app [data-action="${action}"][data-id="${key}"]${returnSection?`[data-section="${returnSection}"]`:''}`);target?.focus({preventScroll:true});return}
 if(a==='collapse'){state.collapsed=!state.collapsed;render();restoreButton(a);return}
 if(a==='sheet-character'){state.selected=id;render();restoreButton(a,id);return}
 if(a==='sheet-section'){state.section=b.dataset.section;render();document.querySelector(`[data-action="sheet-section"][data-section="${state.section}"]`)?.focus({preventScroll:true});return}
 if(a==='clear'){state.query='';render();$('#party-search').focus();return}
 if(a==='restore'){state.empty=false;$('#emptyParty').checked=false;render();return}
});
function restoreButton(action,id){document.querySelector(`#app [data-action="${action}"]${id?`[data-id="${id}"]`:''}`)?.focus({preventScroll:true})}
document.addEventListener('input',e=>{if(e.target.id==='party-search'){const start=e.target.selectionStart;state.query=e.target.value;render();$('#party-search').focus({preventScroll:true});$('#party-search').setSelectionRange(start,start);announce(matches().length+' matching characters')}});
document.addEventListener('change',e=>{if(e.target.id==='check-select'){state.check=e.target.value;render();$('#check-select').focus({preventScroll:true});announce('Party comparison updated')}
 if(e.target.id==='mobile-character'){state.selected=e.target.value;render();$('#mobile-character').focus({preventScroll:true});announce(name(selected())+' selected')}
 if(e.target.id==='longNames'){state.longNames=e.target.checked;render()}
 if(e.target.id==='emptyParty'){state.empty=e.target.checked;state.sheet=false;render()}
 if(e.target.id==='largeText'){$('#preview').dataset.large=e.target.checked;render()}
});
const initial=location.hash.slice(1);if(concepts.some(c=>c.key===initial)){state.layout=initial;state.expanded=expansion[initial]||''}
if(location.hostname==='127.0.0.1'||location.hostname==='localhost')document.body.classList.add('standalone');
render();
console.log('Four preview directions ready; example party only; no network or character writes.');
window.partyPreview={getState:()=>({...state}),save,skill,people,concepts};
</script>
</body></html>
