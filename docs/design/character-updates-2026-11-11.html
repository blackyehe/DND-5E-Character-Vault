<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tabs button{font:inherit;text-align:left;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--foreground);cursor:pointer}.tabs button[aria-selected=true]{border-color:var(--primary);background:var(--secondary)}.tabs strong,.tabs small{display:block}.tabs small{margin-top:4px;color:var(--muted-foreground);font-size:12px}.caption{font-size:14px;line-height:1.5;color:var(--muted-foreground);margin:0 0 12px}.demo{--paper:#1a161a;--field:#130f13;--soft:#36242a;--solid:#be3449;--ink:#f1edef;--muted-ink:#c9bdc1;--line:#623a45;--entry:color-mix(in srgb,var(--solid) 10%,var(--soft));--body:color-mix(in srgb,var(--solid) 5%,var(--field));background:var(--paper);color:var(--ink);padding:16px;border-radius:var(--radius);font-family:"Barlow","Segoe UI",sans-serif;font-size:14px;line-height:1.5}.demo h2{font-size:24px;line-height:1.25;margin:0 0 8px}.demo h3{font-size:19px;line-height:1.3;margin:0}.demo h4{font-size:17px;margin:0 0 10px}.hint{color:var(--muted-ink);font-size:12px;margin:6px 0 0}.demo button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);padding:8px 12px;min-height:38px}.demo button.primary{background:var(--solid);border-color:var(--solid);color:#fff;font-weight:600}.demo button:disabled{opacity:.5;cursor:default}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:3px}.saving-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.saved{color:var(--muted-ink);font-size:12px}.draft-toggle{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:12px;color:var(--muted-ink)}.draft-toggle input{accent-color:var(--solid)}.source{background:var(--entry);border-radius:6px;padding:14px;margin:16px 0 0}.source strong{display:block}.source p{margin:5px 0 0;font-size:13px;color:var(--muted-ink)}.review{background:var(--body);border-radius:6px;margin-top:16px;padding:16px}.review-header{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:16px}.review-header button{flex:none;padding:3px 8px;min-height:30px}.preview{background:var(--entry);border-radius:6px;padding:14px}.change-list{margin:0;padding-left:18px;font-size:14px}.change-list li+li{margin-top:8px}.change-list span{display:block;font-size:12px;color:var(--muted-ink)}.stats{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12px;color:var(--muted-ink);margin-top:14px}.preserved{margin:12px 0 0;font-size:13px;color:var(--muted-ink)}.more{font-size:12px;margin-top:14px;color:var(--muted-ink)}.more summary{cursor:pointer}.more p{margin:8px 0 0}.confirm-copy{font-size:12px;color:var(--muted-ink);line-height:1.55;margin:16px 0 10px}.review-footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.window-backdrop{background:var(--field);padding:16px;margin-top:16px;border-radius:6px}.window-backdrop .review{margin:0;background:var(--paper);max-width:560px;margin-inline:auto}.notice{padding:12px;background:var(--entry);border-radius:6px;margin-top:16px}.footnote{font-size:12px;line-height:1.5;margin:10px 0 0;color:var(--muted-foreground)}[hidden]{display:none!important}@media(max-width:430px){.review,.window-backdrop{padding:12px}.review-footer button{flex:1}.saving-row{align-items:stretch}.saving-row button{flex:1}.saved{flex-basis:100%}.stats{display:grid;gap:4px}}
</style></head><body><div class="tabs" role="tablist" aria-label="Update flow layout"><button id="tab-a" role="tab" aria-selected="true" aria-controls="demo"><strong>A · Inline comparison</strong><small>Review directly below Save</small></button><button id="tab-b" role="tab" aria-selected="false" aria-controls="demo" tabindex="-1"><strong>B · Focused window</strong><small>Review in a compact update window</small></button></div><p id="caption" class="caption"></p><section id="demo" class="demo" role="tabpanel" aria-labelledby="tab-a"></section><p class="footnote">Illustrative preview using the Zhaerin Prison example. Buttons affect only this mockup; no saved item or character is changed.</p><script>
const tabs=[...document.querySelectorAll('[role=tab]')],demo=document.getElementById('demo');let choice=0,opened=true,dirty=false,updated=false;
function preview(){return `<section class="review" aria-label="Update existing characters"><header class="review-header"><div><h3>Update existing characters</h3><p class="hint">Zhaerin Prison · 1 character to update</p></div><button type="button" data-action="close" aria-label="Close update preview">×</button></header><section class="preview"><h4>Volenta</h4><ul class="change-list"><li>Add Banishment to the Shadowfell<span>1 use · Long rest · While equipped</span></li><li>Add Spell Devourer<span>1 use · Long rest · While equipped</span></li></ul><div class="stats"><span>Spell attack <strong>+12</strong> · unchanged</span><span>Save DC <strong>20</strong> · unchanged</span></div></section><p class="preserved">Current HP, spent uses, equipment state and personal notes stay as saved.</p><details class="more"><summary>See all changes</summary><p>Two trackers are added to Volenta’s existing necklace. Both are available while it is equipped and recover on a long rest. Her existing spell bonuses stay the same.</p><p>The saved definition and character must still match this preview when the update is applied.</p></details><p class="confirm-copy">Update Volenta to use the saved Zhaerin Prison rules shown here.</p><footer class="review-footer"><button type="button" data-action="close">Cancel</button><button type="button" class="primary" data-action="apply">Update Volenta</button></footer></section>`}
function render(){tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===choice));tab.tabIndex=i===choice?0:-1});demo.setAttribute('aria-labelledby',tabs[choice].id);document.getElementById('caption').textContent=choice?'Update existing characters opens the comparison immediately. One Update Volenta button confirms the changes; no separate search or source checkbox.':'Update existing characters reveals the comparison beside your work. One Update Volenta button confirms the changes; no separate search or source checkbox.';demo.innerHTML=`<h2>Zhaerin Prison</h2><p class="hint">Item editor · existing saved item</p><section class="source"><strong>Linked trackers</strong><p>Banishment to the Shadowfell · Spell Devourer</p></section><div class="saving-row"><button type="button" class="primary" data-action="save" ${dirty?'':'disabled'}>Save changes</button><button type="button" data-action="open" ${dirty?'disabled':''}>Update existing characters</button><span class="saved" role="status">${dirty?'Unsaved changes · Save first':updated?'Example update complete':'Changes saved'}</span></div><label class="draft-toggle"><input type="checkbox" data-dirty ${dirty?'checked':''}>Try an unsaved draft</label>${dirty?'<p class="hint">Save your draft before updating existing characters.</p>':''}${updated?'<p class="notice" role="status">Example: Volenta now uses the saved item rules and has both trackers.</p>':opened&&!dirty?(choice?'<div class="window-backdrop">'+preview()+'</div>':preview()):''}`}
tabs.forEach((tab,i)=>{tab.onclick=()=>{choice=i;opened=true;updated=false;render()};tab.onkeydown=e=>{const next=e.key==='Home'?0:e.key==='End'?1:e.key==='ArrowLeft'||e.key==='ArrowRight'?1-i:null;if(next!==null){e.preventDefault();choice=next;opened=true;updated=false;render();tabs[next].focus()}}});demo.addEventListener('change',e=>{if(e.target.matches('[data-dirty]')){dirty=e.target.checked;opened=false;updated=false;render()}});demo.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='open'&&!dirty){opened=true;updated=false}if(action==='close')opened=false;if(action==='save'){dirty=false;opened=false;updated=false}if(action==='apply'){updated=true;opened=false}if(action)render()});render();
</script></body></html>
