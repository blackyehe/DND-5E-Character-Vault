<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.choices button{font:inherit;text-align:left;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--foreground);cursor:pointer}.choices button[aria-selected=true]{border-color:var(--primary);background:var(--secondary)}.choices strong,.choices small{display:block}.choices small{font-size:12px;color:var(--muted-foreground);margin-top:3px}.explanation{font-size:14px;line-height:1.5;margin:0 0 12px;color:var(--muted-foreground)}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.demo{--paper:#1a161a;--soft:#36242a;--field:#130f13;--solid:#be3449;--ink:#f1edef;--muted-ink:#c9bdc1;--line:#623a45;--entry:color-mix(in srgb,var(--solid) 10%,var(--soft));--body:color-mix(in srgb,var(--solid) 5%,var(--field));--radius:6px;background:var(--paper);color:var(--ink);padding:16px;border-radius:var(--radius);font-family:"Barlow","Segoe UI",sans-serif;font-size:14px}.demo h2{font-size:22px;line-height:1.3;margin:0 0 12px;font-weight:650}.demo h3{font-size:16px;margin:18px 0 9px}.demo h3:first-child{margin-top:0}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px 12px}.entry{min-width:0}.rule{min-width:0;border-radius:6px;background:var(--entry);overflow:hidden}.rule>summary{display:flex;align-items:center;gap:10px;padding:14px;min-height:90px;cursor:pointer;list-style:none}.rule>summary::-webkit-details-marker{display:none}.identity{display:grid;gap:5px;min-width:0;flex:1;overflow-wrap:anywhere}.identity strong{font-size:15px;font-weight:650}.identity small{font-size:12px;color:var(--muted-ink)}.result{font-size:12px;font-weight:600;max-width:43%;text-align:right}.chevron{font-size:13px;color:var(--muted-ink)}details[open] .chevron{transform:rotate(180deg)}.rules{padding:14px;background:var(--body);line-height:1.6;font-size:13px;overflow-wrap:anywhere}.rules p{margin:0 0 8px}.rules p:last-child{margin-bottom:0}.attack{background:color-mix(in srgb,var(--solid) 24%,var(--soft));padding:5px 7px;display:inline-block;white-space:nowrap;border-radius:4px}.demo button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;padding:7px 9px;min-height:34px;cursor:pointer}.demo input[type=checkbox]{accent-color:var(--solid);width:16px;height:16px;margin:0}.demo input[type=number]{width:46px;min-width:0;font:inherit;font-size:12px;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);padding:6px;min-height:34px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}.actions small,.item-note{font-size:12px;color:var(--muted-ink)}.item-note{line-height:1.5;margin:7px 0 0}.checks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap}.quantity{display:grid;gap:4px;font-size:11px;color:var(--muted-ink)}.items{display:grid;gap:12px}.item-controls{display:grid;grid-template-columns:1fr 48px 94px;gap:8px;align-items:center;min-width:0}.note{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--muted-foreground)}.demo-footer{margin:18px 0 0;font-size:12px;color:var(--muted-ink)}
.demo[data-choice=a] .spell{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:8px;align-items:start}.demo[data-choice=a] .spell>.actions{padding-top:14px;min-height:48px}.demo[data-choice=a] .spell>.actions button{width:78px;padding-inline:5px}.demo[data-choice=a] .spell>.actions small{width:78px;text-align:center}.demo[data-choice=a] .item{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:14px;align-items:start}.demo[data-choice=a] .item-controls{padding-top:9px}.demo[data-choice=a] .checks{display:grid;gap:7px}.demo[data-choice=a] .item .rule>summary{min-height:80px}.demo[data-choice=a] .feature .rule>summary{min-height:80px}
.demo[data-choice=b] .entries,.demo[data-choice=b] .items{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),330px));gap:12px;justify-content:start}.demo[data-choice=b] .entry{display:flex;flex-direction:column;background:var(--entry);border-radius:6px;overflow:hidden}.demo[data-choice=b] .entry>.actions,.demo[data-choice=b] .item-controls{background:var(--body);padding:10px 12px;margin-top:auto;min-height:54px}.demo[data-choice=b] .entry>.actions{justify-content:flex-end}.demo[data-choice=b] .entry>.actions>small{margin-right:auto}.demo[data-choice=b] .item-controls{grid-template-columns:minmax(0,1fr) 46px 94px}.demo[data-choice=b] .item-note{margin:0;padding:0 14px 12px}.demo[data-choice=b] .checks{display:grid;gap:7px}.demo[data-choice=b] .feature .rule>summary{min-height:90px}
@media(max-width:600px){.demo[data-choice=a] .item{grid-template-columns:minmax(0,1fr);gap:8px}.demo[data-choice=a] .item-controls{padding:0;grid-template-columns:minmax(0,1fr) 48px 94px}.demo[data-choice=a] .checks{display:flex}.demo[data-choice=a] .spell{grid-template-columns:minmax(0,1fr) 78px}.demo{padding:16px}.rule>summary{padding:12px;gap:7px}.result{max-width:44%}}
</style></head><body><p class="note">Historical proposals ? neither was selected. The approved implementation changes widths only and preserves the existing independent columns and controls.</p><div class="choices" role="tablist" aria-label="Panel width options"><button id="tab-a" role="tab" aria-selected="true" aria-controls="sample"><strong>A · Aligned rows</strong><small>Reserve equal space beside each panel</small></button><button id="tab-b" role="tab" aria-selected="false" aria-controls="sample" tabindex="-1"><strong>B · Uniform cards</strong><small>Bound the width; put controls underneath</small></button></div><p id="explanation" class="explanation"></p><section id="sample" class="demo" data-choice="a" role="tabpanel" aria-labelledby="tab-a"></section><p class="note">Current C theme colours. Open a row to check the rules; sample controls change only this preview. No character data is saved.</p><script>
const sample=document.getElementById('sample'),tabs=[...document.querySelectorAll('[role=tab]')];
const spells=[['Friends','Dawnwalker Vampire · INT','Confirm casting rules','granted'],['Charm Person','Dawnwalker Vampire · INT','Confirm casting rules','granted'],['Fire Bolt','Spellbook · INT','<span class="attack">1d20 +12</span>','cantrip'],['Message','Spellbook · INT','No attack or save','cantrip'],['Elemental Bane','Spellbook · INT','See rules','spell'],['Wall of Fire','Spellbook · INT','DEX save DC 20','spell']];
function rule(name,meta,result,body){return `<details class="rule"><summary><span class="identity"><strong>${name}</strong>${meta?`<small>${meta}</small>`:''}</span>${result?`<span class="result">${result}</span>`:''}<span class="chevron" aria-hidden="true">⌄</span></summary><div class="rules">${body}</div></details>`}
function spell(row){const[name,source,result,kind]=row;return `<article class="entry spell">${rule(name,source,result,'<p><strong>Casting time:</strong> 1 action<br><strong>Range:</strong> See spell rules<br><strong>Duration:</strong> See spell rules</p><p>The full spell description expands here within the same panel width.</p>')}<div class="actions">${kind==='granted'?'<small>Granted spell</small>':kind==='cantrip'?'<small>At will</small>':'<button type="button" data-prepare>Prepared</button>'}</div></article>`}
const itemData=[['Cloak of Elvenkind',true,'Requires attunement · magical bonuses are inactive','Wondrous Items · 0 lb.'],['Zhaerin Prison',false,'','Wondrous Items · 0 lb.'],['Lucky Knots',false,'','Treasure / valuables · 0 lb.']];
function item(row){const[name,attunement,note,meta]=row;return `<article class="entry item"><div>${rule(name,'','',`<p>${meta}</p><p>Item description, benefits and linked trackers expand here.</p>`)}${note?`<p class="item-note">${note}</p>`:''}<p class="item-note">${meta}</p></div><div class="item-controls"><div class="checks">${name==='Lucky Knots'?'':`<label><input type="checkbox" checked>Equipped</label>`}${attunement?'<label><input type="checkbox">Attuned</label>':''}</div><label class="quantity">Quantity<input type="number" aria-label="${name} quantity" value="1" min="0"></label><button type="button" data-remove>Remove item</button></div></article>`}
function select(index){tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1});sample.dataset.choice=index?'b':'a';sample.setAttribute('aria-labelledby',tabs[index].id);document.getElementById('explanation').textContent=index?'Each complete card stops at 330px, with the same width for granted spells, ordinary spells, items and features. Controls sit below the header, so missing buttons never change its width. Cards wrap into fewer columns as space narrows.':'Keep the familiar row layout, but reserve a consistent control area in each list. Every spell header lines up with its neighbours; every inventory header ends at the same point, whether attunement is available or not. Controls move below on narrow screens.';sample.innerHTML=`<h2>Spells</h2><h3>Granted spells</h3><div class="entries">${spells.slice(0,2).map(spell).join('')}</div><h3>Cantrips</h3><div class="entries">${spells.slice(2,4).map(spell).join('')}</div><h3>Level 4 spells</h3><div class="entries">${spells.slice(4).map(spell).join('')}</div><h3>Inventory</h3><div class="items">${itemData.map(item).join('')}</div><h3>Features & traits</h3><div class="entries">${['Tough','Keen Mind'].map(name=>`<article class="entry feature">${rule(name,'Feat','', '<p>Feature rules expand within the same bounded panel.</p>')}</article>`).join('')}</div><p class="demo-footer" role="status">Widths follow the available sheet space; text and expanded rules can grow vertically.</p>`}
tabs.forEach((tab,i)=>{tab.onclick=()=>select(i);tab.onkeydown=e=>{const next=e.key==='Home'?0:e.key==='End'?1:e.key==='ArrowRight'||e.key==='ArrowLeft'?1-i:null;if(next!==null){e.preventDefault();select(next);tabs[next].focus()}}});sample.onclick=e=>{const button=e.target.closest('button');if(button?.hasAttribute('data-prepare'))button.textContent=button.textContent==='Prepared'?'Prepare':'Prepared';if(button?.hasAttribute('data-remove'))sample.querySelector('[role=status]').textContent='Example only: no inventory item was removed.'};select(1);
</script></body></html>
