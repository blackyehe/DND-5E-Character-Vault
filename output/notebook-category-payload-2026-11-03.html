<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent;color:var(--foreground);font-family:var(--font-sans)}
#notebook-payload{display:grid;gap:15px}h3{margin:0;padding-right:90px;font-size:16px;font-weight:500}
.label{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:14px;margin-bottom:6px}.value{font-variant-numeric:tabular-nums}
.track{height:16px;background:var(--muted)}.bar{height:16px;background:var(--chart-1)}.before{opacity:.6}
.note{font-size:12px;color:var(--muted-foreground);line-height:1.5}
</style></head><body>
<div id="notebook-payload" role="img" aria-label="After initial opening, the same Places category results use 17,914 bytes with full navigation metadata, or 6,013 bytes when the verified navigation metadata is reused.">
<h3>Notebook category response</h3>
<div><div class="label"><span>Full metadata</span><span class="value">17,914 bytes</span></div><div class="track"><div class="bar before" style="width:100%"></div></div></div>
<div><div class="label"><span>Live: reuse navigation</span><span class="value">6,013 bytes</span></div><div class="track"><div class="bar" style="width:33.5659%"></div></div></div>
<div class="note">Follow-up Places requests with identical entries and counts.<br>Response size only; this does not measure load time.</div>
</div></body></html>
